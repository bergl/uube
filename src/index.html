<!doctype html>
<html lang="en" data-theme="prague">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Guest data may only ever leave the device towards the Anthropic API. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.anthropic.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ubyport">
<meta name="theme-color" content="#8fbcd4">
<title>Ubyport Helper</title>
<style>
  /* ---------------------------------------------------------------- themes */
  [data-theme="prague"] {
    --bg: #fbf5ec; --bg-2: #f6ebdd; --card: #fffdf9; --text: #2d2026; --muted: #7d6a66; --line: #ecdfd0; --input: #fff;
    --accent: #c2502b; --accent-2: #2f6f8f; --accent-text: #fff; --accent-soft: #fbe4d9;
    --ok: #2c7a4b; --ok-bg: #e2f3e7; --warn: #9a6200; --warn-bg: #fff0d1; --bad: #b8321f; --bad-bg: #fde5df; --info: #2f6f8f; --info-bg: #e1eff5;
    --sky-1: #8dbbd4; --sky-2: #f4c6a6; --sky-3: #fde3c3; --hero-text: #3a2129;
    --far: #c99a8c; --near: #4b2f38; --river: #6d9bb2; --sun: #ffcf6e; --cloud: rgba(255,255,255,.8); --window: #ffd46b;
    --av-l: 86%; --av-tl: 30%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: inline; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  [data-theme="night"] {
    --bg: #0c1121; --bg-2: #111832; --card: #161e36; --text: #eef1f8; --muted: #9aa4c0; --line: #273050; --input: #1c2541;
    --accent: #f2c14e; --accent-2: #7da7ff; --accent-text: #1c1505; --accent-soft: #3a3217;
    --ok: #6fd39a; --ok-bg: #13321f; --warn: #f5c25b; --warn-bg: #3a2c0b; --bad: #ff8b7b; --bad-bg: #3f1915; --info: #8fb4ff; --info-bg: #1a2a4d;
    --sky-1: #070b24; --sky-2: #1b2259; --sky-3: #3b2d6b; --hero-text: #fff6dc;
    --far: #1c2147; --near: #05070f; --river: #18244d; --sun: #fdf3c8; --cloud: rgba(255,255,255,.12); --window: #ffd36b;
    --av-l: 32%; --av-tl: 88%;
    --show-sun: inline; --show-stars: inline; --show-clouds: none; --show-birds: none; --show-windows: inline; --show-petals: none;
    color-scheme: dark;
  }
  [data-theme="vltava"] {
    --bg: #edf5f6; --bg-2: #e2eef1; --card: #fff; --text: #14313a; --muted: #5a7680; --line: #d2e3e7; --input: #fff;
    --accent: #1a7d8c; --accent-2: #e07a5f; --accent-text: #fff; --accent-soft: #d8eef1;
    --ok: #237a52; --ok-bg: #dff3e9; --warn: #946000; --warn-bg: #fff0d0; --bad: #b4382a; --bad-bg: #fbe4e0; --info: #1a7d8c; --info-bg: #dcf0f3;
    --sky-1: #a9d8e8; --sky-2: #d9eff4; --sky-3: #f8fbf3; --hero-text: #123540;
    --far: #93bcc6; --near: #1c4552; --river: #3a95a7; --sun: #fff0a8; --cloud: rgba(255,255,255,.9); --window: #ffd46b;
    --av-l: 87%; --av-tl: 28%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: inline; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  [data-theme="petrin"] {
    --bg: #f5f9f0; --bg-2: #fbeef3; --card: #fff; --text: #22321f; --muted: #66785f; --line: #dce8d3; --input: #fff;
    --accent: #3b8a54; --accent-2: #df6f9b; --accent-text: #fff; --accent-soft: #e2f2e5;
    --ok: #2f7f4a; --ok-bg: #e1f3e5; --warn: #926000; --warn-bg: #fff0d0; --bad: #b5362c; --bad-bg: #fce4e3; --info: #a94a77; --info-bg: #fbe3ee;
    --sky-1: #c7ecd8; --sky-2: #f9dce8; --sky-3: #fff8ee; --hero-text: #213a26;
    --far: #a7c8a3; --near: #2e4a35; --river: #79b5a3; --sun: #ffe08f; --cloud: rgba(255,255,255,.85); --window: #ffd46b;
    --av-l: 88%; --av-tl: 28%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: none; --show-windows: none; --show-petals: inline;
    color-scheme: light;
  }
  [data-theme="classic"] {
    --bg: #f3f5f8; --bg-2: #eceff4; --card: #fff; --text: #1b2430; --muted: #5d6b7c; --line: #d9dee6; --input: #fff;
    --accent: #1f4e79; --accent-2: #3d7cc9; --accent-text: #fff; --accent-soft: #e1eaf4;
    --ok: #1d7a46; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff2d6; --bad: #b42318; --bad-bg: #fde8e6; --info: #1f4e79; --info-bg: #e1eaf4;
    --sky-1: #1f4e79; --sky-2: #2d6399; --sky-3: #3d78b0; --hero-text: #fff;
    --far: #34699c; --near: #163a5c; --river: #2a5f90; --sun: #ffffff; --cloud: rgba(255,255,255,.18); --window: #ffd46b;
    --av-l: 88%; --av-tl: 30%;
    --show-sun: none; --show-stars: none; --show-clouds: inline; --show-birds: none; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="classic"] {
      --bg: #12161c; --bg-2: #161b23; --card: #1b2129; --text: #e6eaf0; --muted: #9aa6b5; --line: #2e3743; --input: #232b35;
      --accent: #5b9bd5; --accent-2: #8ab8e6; --accent-text: #0d1117; --accent-soft: #1d2c3d;
      --ok: #5cc48a; --ok-bg: #173324; --warn: #f0b94a; --warn-bg: #3a2c0c; --bad: #ff7b6e; --bad-bg: #3d1714; --info: #8ab8e6; --info-bg: #1d2c3d;
      --sky-1: #0f2238; --sky-2: #163152; --sky-3: #1d3f66; --far: #1f4168; --near: #0a1828; --river: #15304f;
      --av-l: 30%; --av-tl: 88%;
      color-scheme: dark;
    }
  }

  /* ---------------------------------------------------------------- base */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The root background shows behind the iOS status bar and when pulling the page down,
     so it matches the top of the header. The body paints the page colour itself. */
  html { -webkit-text-size-adjust: 100%; background: var(--sky-1); transition: background-color .4s; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%) fixed;
    font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color .4s, color .4s;
  }
  main { max-width: 640px; margin: -18px auto 0; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
  h1, h2, h3 { letter-spacing: -.01em; }
  h2 { font-size: 1.12rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  a { color: var(--accent); font-weight: 600; }
  svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .hint { margin: 6px 0 0; }

  /* ---------------------------------------------------------------- hero */
  .hero {
    position: relative; overflow: hidden; height: calc(200px + env(safe-area-inset-top));
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 62%, var(--sky-3) 100%);
    transition: background .5s;
  }
  .scene { position: absolute; inset: auto 0 0 0; width: 100%; height: 66%; display: block; stroke: none; overflow: visible; }
  .scene .far { fill: var(--far); transition: fill .5s; }
  .scene .near { fill: var(--near); transition: fill .5s; }
  .scene .river { fill: var(--river); transition: fill .5s; }
  .scene .shimmer rect { fill: rgba(255,255,255,.55); animation: shimmer 5s ease-in-out infinite; }
  .scene .shimmer rect:nth-child(2) { animation-delay: -1.5s; } .scene .shimmer rect:nth-child(3) { animation-delay: -3s; } .scene .shimmer rect:nth-child(4) { animation-delay: -4s; }
  .scene .deco-sun { display: var(--show-sun); }
  .scene .sun { fill: var(--sun); }
  .scene .sun-glow { fill: var(--sun); opacity: .25; transform-box: fill-box; transform-origin: center; animation: glow 6s ease-in-out infinite; }
  .scene .deco-stars { display: var(--show-stars); fill: #fff; }
  .scene .deco-stars circle { animation: twinkle 3.2s ease-in-out infinite; }
  .scene .deco-clouds { display: var(--show-clouds); fill: var(--cloud); }
  .scene .cloud { animation: drift 46s linear infinite; }
  .scene .cloud.c2 { animation-duration: 64s; animation-delay: -30s; }
  .scene .deco-birds { display: var(--show-birds); stroke: var(--near); stroke-width: .8; fill: none; animation: fly 30s linear infinite; }
  .scene .deco-windows { display: var(--show-windows); fill: var(--window); }
  .scene .deco-windows rect { animation: twinkle 7s ease-in-out infinite; }
  .scene .deco-windows rect:nth-child(3n) { animation-delay: -2s; } .scene .deco-windows rect:nth-child(4n) { animation-delay: -4.5s; }
  .scene .deco-petals { display: var(--show-petals); fill: var(--accent-2); opacity: .8; }
  .scene .deco-petals ellipse { animation: petal 10s linear infinite; transform-box: fill-box; }
  .hero-text { position: absolute; left: 0; right: 0; top: calc(18px + env(safe-area-inset-top)); padding: 0 20px; max-width: 640px; margin: 0 auto; color: var(--hero-text); }
  .hero-text h1 { margin: 0; font-size: 1.75rem; font-weight: 800; line-height: 1.15; padding-right: 110px; }
  .hero-text p { margin: 6px 0 0; font-weight: 650; font-size: .92rem; opacity: .85; }
  .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 1; }
  .hero-tools { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top)); right: 14px; display: flex; gap: 8px; }
  .hero-btn {
    display: inline-flex; align-items: center; gap: 4px; height: 36px; min-width: 36px; padding: 0 10px; border-radius: 999px; border: 0;
    background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--text); font: inherit; font-size: .85rem; font-weight: 700;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0,0,0,.08); cursor: pointer;
  }

  /* ---------------------------------------------------------------- cards and controls */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin: 0 0 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.12); transition: background-color .4s, border-color .4s;
  }
  .num, .rnum {
    display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: .85rem; font-weight: 800;
    background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
  }
  label { display: block; font-size: .82rem; font-weight: 650; color: var(--muted); margin: 12px 0 0; }
  input, select {
    display: block; width: 100%; margin-top: 5px; padding: 11px 13px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--input); border: 1.5px solid var(--line); border-radius: 13px; min-width: 0;
    transition: border-color .2s, box-shadow .2s, background-color .4s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .two, .three { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr; }
  .three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input { flex: 1; }
  .inline .chip { margin-top: 5px; }

  button, .button-like {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 650;
    padding: 11px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer; margin: 10px 0 0; transition: transform .12s, box-shadow .2s, background-color .2s, opacity .2s;
  }
  button:active:not(:disabled), .button-like:active { transform: scale(.96); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color: var(--accent-text); border-color: transparent;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .primary:not(:disabled):hover { box-shadow: 0 10px 26px -8px color-mix(in srgb, var(--accent) 85%, transparent); }
  .success { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .wide { width: 100%; }
  .ghost { border-style: dashed; background: transparent; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: .85rem; margin: 0; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; margin: 0; font-weight: 650; }
  .danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: transparent; width: 100%; margin-top: 8px; }
  .danger-link { color: var(--bad); font-size: .85rem; margin-top: 12px; }
  .back { border: 0; background: color-mix(in srgb, var(--card) 85%, transparent); padding: 7px 14px 7px 8px; border-radius: 999px; margin: 0 0 12px; box-shadow: 0 4px 14px -6px rgba(0,0,0,.2); }
  .row-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-weight: 750; }
  .pill svg { width: 1em; height: 1em; stroke-width: 3; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.info, .pill.calm { background: var(--info-bg); color: var(--info); }
  .pill.muted { background: var(--bg-2); color: var(--muted); }
  .pill.bad, .stay-card.s-bad .pill { animation: pulse 2.2s ease-in-out infinite; }
  .verified { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }

  .avatar {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: .78rem; font-weight: 800;
    background: hsl(var(--h) 65% var(--av-l)); color: hsl(var(--h) 45% var(--av-tl)); border: 2px solid var(--card); flex-shrink: 0;
  }
  .avatars { display: inline-flex; }
  .avatars .avatar { width: 28px; height: 28px; font-size: .68rem; margin-right: -8px; }
  .avatars:empty { display: none; }

  /* ---------------------------------------------------------------- stays list */
  .section-title { margin: 22px 4px 10px; }
  .count { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 1px 9px; font-size: .8rem; }
  .stack { display: grid; gap: 10px; }
  .stay-card {
    display: grid; gap: 6px; width: 100%; text-align: left; justify-content: stretch; justify-items: stretch; margin: 0; padding: 14px 16px 14px 20px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -14px rgba(0,0,0,.18);
  }
  .stay-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--info); }
  .stay-card.s-bad::before { background: var(--bad); } .stay-card.s-warn::before { background: var(--warn); }
  .stay-card.s-ok::before { background: var(--ok); } .stay-card.s-muted::before { background: var(--line); }
  .stay-card:hover { transform: translateY(-1px); }
  .stay-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stay-place { font-weight: 800; font-size: 1.02rem; }
  .stay-dates { font-weight: 600; }
  .arrow { color: var(--accent); }
  .stay-bottom { display: flex; align-items: center; gap: 14px; }
  .chev { margin-left: auto; font-size: 1.5rem; line-height: 1; color: var(--muted); transition: transform .2s; }
  .stay-card:hover .chev { transform: translateX(3px); }
  .all-done { text-align: center; font-weight: 650; color: var(--muted); padding: 10px; }
  .history { margin-top: 18px; }
  .history summary { font-weight: 700; color: var(--muted); padding: 8px 4px; cursor: pointer; }
  .history .stay-card { opacity: .82; }
  .empty { text-align: center; padding: 8px 8px 20px; }
  .empty-art { height: 90px; position: relative; border-radius: 18px; overflow: hidden; margin: 18px auto 6px; max-width: 280px;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 60%, var(--sky-3)); }
  .empty h3 { margin: 12px 0 4px; }

  .onboarding h2 { font-size: 1.3rem; }
  .onboarding p { margin: 0 0 6px; }
  .checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .checklist button { width: 100%; justify-content: flex-start; text-align: left; margin: 0; background: var(--bg); border-color: transparent; }
  .checklist .tick { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .85rem; font-weight: 800; }
  .checklist .done button { color: var(--muted); text-decoration: line-through; }
  .checklist .done .tick { background: var(--ok); color: #fff; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  .checklist .done .tick svg { stroke-width: 3; width: 14px; height: 14px; }

  /* ---------------------------------------------------------------- stay detail */
  .stepper { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 14px; padding: 12px 8px; border-radius: 20px;
    background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(6px); }
  .stepper li { display: grid; justify-items: center; gap: 4px; font-size: .74rem; font-weight: 700; color: var(--muted); position: relative; }
  .stepper li:not(:last-child)::after { content: ""; position: absolute; top: 13px; left: calc(50% + 17px); right: calc(-50% + 17px); height: 3px; border-radius: 2px; background: var(--line); }
  .stepper li.done:not(:last-child)::after { background: var(--ok); }
  .stepper .dot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-2); color: var(--muted); font-size: .8rem; font-weight: 800; transition: background-color .3s, transform .3s; }
  .stepper .done .dot { background: var(--ok); color: #fff; }
  .stepper .done .dot svg { width: 15px; height: 15px; stroke-width: 3; }
  .stepper .current { color: var(--accent); }
  .stepper .current .dot { background: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation: ring 2s ease-out infinite; }

  .deadline { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; }
  .ask { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
  .ask > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .chips { display: inline-flex; gap: 6px; }

  .upload {
    display: grid; justify-items: center; gap: 4px; text-align: center; border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 20px; padding: 20px 14px; margin: 14px 0 4px; cursor: pointer; color: var(--text);
    background: color-mix(in srgb, var(--accent-soft) 45%, transparent); transition: transform .15s, background-color .2s;
  }
  .upload:active { transform: scale(.98); }
  .upload input { display: none; }
  .upload-icon svg, .scan-doc svg { width: 72px; height: 50px; stroke: none; }
  .upload-icon { animation: bob 3s ease-in-out infinite; }
  .pp-body { fill: var(--accent); } .pp-photo { fill: color-mix(in srgb, var(--accent-text) 75%, transparent); }
  .pp-line { fill: color-mix(in srgb, var(--accent-text) 55%, transparent); } .pp-mrz { fill: color-mix(in srgb, var(--accent-text) 85%, transparent); }
  .upload-title { font-weight: 800; font-size: 1.05rem; color: var(--accent); }
  .upload small { color: var(--muted); max-width: 34ch; }

  .scanner { display: grid; justify-items: center; gap: 6px; padding: 20px 14px; margin: 14px 0 4px; border-radius: 20px; background: var(--accent-soft); text-align: center; }
  .scan-doc { position: relative; width: 96px; height: 66px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; }
  .scan-doc svg { width: 96px; height: 66px; }
  .beam { position: absolute; left: 0; right: 0; height: 18px; top: -18px;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent-2) 60%, transparent), transparent); animation: scan 1.6s ease-in-out infinite; }
  .scan-text { font-weight: 800; color: var(--accent); min-height: 1.4em; }
  .scan-text.swap { animation: rise .45s ease both; }

  .guest { border-top: 1px solid var(--line); padding: 16px 0 4px; margin-top: 14px; }
  .guest.has-errors .guest-head .avatar { box-shadow: 0 0 0 2px var(--bad); }
  .guest-head { display: flex; align-items: center; gap: 10px; }
  .guest-name { display: grid; flex: 1; min-width: 0; }
  .guest-name strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guest .avatar { width: 40px; height: 40px; font-size: .85rem; }
  ul.errors, ul.warnings { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .86rem; }
  ul.errors li, ul.warnings li { padding: 8px 12px; border-radius: 12px; }
  ul.errors li { background: var(--bad-bg); color: var(--bad); }
  ul.warnings li { background: var(--warn-bg); color: var(--warn); }
  .all-good { display: flex; align-items: center; gap: 10px; font-weight: 750; color: var(--ok); background: var(--ok-bg); padding: 10px 14px; border-radius: 14px; margin: 0; }
  .draw-check { width: 26px; height: 26px; stroke-width: 2.4; }
  .draw-check circle { stroke-dasharray: 64; stroke-dashoffset: 64; animation: draw .6s ease forwards; }
  .draw-check path { stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw .35s .45s ease forwards; }
  .rsteps { display: grid; gap: 14px; margin-top: 16px; }
  .rstep { display: flex; gap: 12px; align-items: flex-start; }
  .rstep > div { flex: 1; padding-top: 2px; }
  .rstep button { margin-top: 8px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; padding: 6px 0; font-weight: 650; }
  .property { border-top: 1px solid var(--line); padding: 8px 0 12px; }
  .copy-table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: .9rem; }
  .copy-table caption { text-align: left; font-weight: 800; padding: 6px 0; display: flex; align-items: center; gap: 8px; }
  .copy-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px 6px 0; width: 40%; }
  .copy-table td { padding: 6px 0; word-break: break-word; }
  .copy-table td:last-child { text-align: right; width: 1%; padding-left: 8px; }

  /* ---------------------------------------------------------------- settings */
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .theme-card { display: grid; gap: 2px; text-align: left; padding: 8px 8px 10px; margin: 0; border-radius: 18px; background: var(--bg); border: 2px solid transparent; }
  .theme-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .theme-preview { display: block; position: relative; height: 72px; border-radius: 12px; overflow: hidden; margin-bottom: 6px;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 62%, var(--sky-3)); }
  .theme-preview .scene, .empty-art .scene { height: 100%; }
  .theme-name { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--text); }
  .theme-check { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-text); opacity: 0; transform: scale(.3); transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
  .theme-check svg { width: 12px; height: 12px; stroke-width: 3.5; }
  .theme-card.selected .theme-check { opacity: 1; transform: scale(1); }
  .theme-tag { font-size: .76rem; color: var(--muted); font-weight: 500; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-top: 6px; border-radius: 14px; background: var(--bg); }
  .segmented button { margin: 0; border: 0; padding: 9px 6px; background: transparent; border-radius: 11px; }
  .segmented button.on { background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.1); color: var(--accent); }

  .help-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .help-steps li { display: flex; gap: 12px; align-items: flex-start; }
  .help-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--accent-soft); font-size: 1.2rem; flex-shrink: 0; }
  .prose ul { padding-left: 20px; margin: 0; } .prose li { margin: 6px 0; }

  /* ---------------------------------------------------------------- tab bar, toast, confetti */
  .tabbar {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom));
    width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 26px; background: color-mix(in srgb, var(--card) 82%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 12px 34px -10px rgba(0,0,0,.3);
  }
  .tab { display: grid; justify-items: center; gap: 2px; margin: 0; padding: 6px; border: 0; background: transparent; color: var(--muted); font-size: .72rem; border-radius: 16px; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); background: var(--accent-soft); }
  .fab { width: 58px; height: 58px; margin: -26px 0 0; padding: 0; border-radius: 50%; border: 4px solid var(--bg); color: var(--accent-text);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--accent) 80%, transparent); }
  .fab svg { width: 28px; height: 28px; stroke-width: 2.6; transition: transform .3s; }
  .fab:active svg { transform: rotate(90deg); }

  #toast-layer { position: fixed; z-index: 20; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top)); display: grid; justify-items: center; pointer-events: none; padding: 0 16px; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 520px; padding: 12px 16px; border-radius: 18px; font-weight: 650; cursor: pointer;
    background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: 0 14px 34px -10px rgba(0,0,0,.35); animation: drop .45s cubic-bezier(.2,1.4,.4,1) both; }
  .toast.leaving { animation: lift .35s ease both; }
  .toast-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; font-weight: 900; }
  .toast.ok .toast-icon { background: var(--ok); color: #fff; } .toast.ok .toast-icon svg { width: 15px; height: 15px; stroke-width: 3; }
  .toast.error .toast-icon { background: var(--bad); color: #fff; }
  .toast.error { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .confetti i { position: absolute; bottom: 22%; width: 9px; height: 13px; border-radius: 2px; animation: burst 1.9s cubic-bezier(.15,.7,.35,1) forwards; }

  /* ---------------------------------------------------------------- motion */
  .enter > * { animation: rise .5s cubic-bezier(.2,.8,.3,1) both; }
  .enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; }
  .enter > *:nth-child(5) { animation-delay: .2s; } .enter > *:nth-child(n+6) { animation-delay: .25s; }
  .enter .stack > * { animation: rise .5s cubic-bezier(.2,.8,.3,1) both; }
  .enter .stack > *:nth-child(2) { animation-delay: .12s; } .enter .stack > *:nth-child(3) { animation-delay: .18s; } .enter .stack > *:nth-child(n+4) { animation-delay: .24s; }
  .pop-in { animation: rise .55s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i, 0) * .12s); }
  .help-steps li { animation: rise .5s both; animation-delay: calc(var(--i) * .07s + .1s); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-24px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes lift { to { opacity: 0; transform: translateY(-16px); } }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(460px); } }
  @keyframes fly { from { transform: translate(-30px, 46px); } to { transform: translate(430px, 22px); } }
  @keyframes glow { 50% { transform: scale(1.25); opacity: .12; } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes shimmer { 50% { transform: translateX(14px); opacity: .2; } }
  @keyframes petal { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translate(-60px, 130px) rotate(540deg); opacity: 0; } }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 15%, 45% { transform: rotate(16deg); } 30%, 60% { transform: rotate(-8deg); } 75% { transform: rotate(0); } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
  @keyframes scan { 0% { top: -18px; } 100% { top: 66px; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @keyframes pulse { 50% { opacity: .65; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes burst {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    45% { transform: translate(calc(var(--dx) * .7), var(--dy)) rotate(calc(var(--r) * .5)); opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) * -.3 + 260px)) rotate(var(--r)); opacity: 0; }
  }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
