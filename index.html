<!doctype html>
<html lang="ru" data-theme="prague">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Guest data may only ever leave the device towards the Anthropic API. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src https://api.anthropic.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ubyport">
<meta name="theme-color" content="#8fbcd4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Ubyport Helper</title>
<style>
  /* ---------------------------------------------------------------- themes */
  [data-theme="prague"] {
    --bg: #fbf5ec; --bg-2: #f6ebdd; --card: #fffdf9; --text: #2d2026; --muted: #75635f; --line: #ecdfd0; --line-strong: #a08b7f; --input: #fff;
    --accent: #c2502b; --accent-strong: #ad4726; --accent-2: #2f6f8f; --accent-text: #fff; --accent-soft: #fbe4d9;
    --ok: #2b784a; --ok-bg: #e2f3e7; --warn: #976000; --warn-bg: #fff0d1; --bad: #b8321f; --bad-bg: #fde5df; --info: #2f6f8f; --info-bg: #e1eff5;
    --sky-1: #8dbbd4; --sky-2: #f4c6a6; --sky-3: #fde3c3; --hero-text: #3a2129; --hero-shadow: 0 1px 1px rgba(255,248,238,.95), 0 0 8px rgba(255,236,214,.95), 0 0 18px rgba(253,227,195,.8);
    --far: #c99a8c; --near: #4b2f38; --river: #6d9bb2; --sun: #ffcf6e; --cloud: rgba(255,255,255,.8); --window: #ffd46b;
    --av-l: 86%; --av-tl: 30%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: inline; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  [data-theme="night"] {
    --bg: #0c1121; --bg-2: #111832; --card: #161e36; --text: #eef1f8; --muted: #9aa4c0; --line: #273050; --line-strong: #65739f; --input: #1c2541;
    --accent: #f2c14e; --accent-strong: #f2c14e; --accent-2: #7da7ff; --accent-text: #1c1505; --accent-soft: #3a3217;
    --ok: #6fd39a; --ok-bg: #13321f; --warn: #f5c25b; --warn-bg: #3a2c0b; --bad: #ff8b7b; --bad-bg: #3f1915; --info: #8fb4ff; --info-bg: #1a2a4d;
    --sky-1: #070b24; --sky-2: #1b2259; --sky-3: #3b2d6b; --hero-text: #fff6dc; --hero-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 10px rgba(4,6,22,.85), 0 0 22px rgba(4,6,22,.6);
    --far: #1c2147; --near: #05070f; --river: #18244d; --sun: #fdf3c8; --cloud: rgba(255,255,255,.12); --window: #ffd36b;
    --av-l: 32%; --av-tl: 88%;
    --show-sun: inline; --show-stars: inline; --show-clouds: none; --show-birds: none; --show-windows: inline; --show-petals: none;
    color-scheme: dark;
  }
  [data-theme="vltava"] {
    --bg: #edf5f6; --bg-2: #e2eef1; --card: #fff; --text: #14313a; --muted: #536c76; --line: #d2e3e7; --line-strong: #76959d; --input: #fff;
    --accent: #1a7d8c; --accent-strong: #18717f; --accent-2: #e07a5f; --accent-text: #fff; --accent-soft: #d8eef1;
    --ok: #227851; --ok-bg: #dff3e9; --warn: #946000; --warn-bg: #fff0d0; --bad: #b4382a; --bad-bg: #fbe4e0; --info: #187381; --info-bg: #dcf0f3;
    --sky-1: #a9d8e8; --sky-2: #d9eff4; --sky-3: #f8fbf3; --hero-text: #123540; --hero-shadow: 0 1px 1px rgba(255,255,255,.95), 0 0 8px rgba(236,248,251,.95), 0 0 18px rgba(217,239,244,.8);
    --far: #93bcc6; --near: #1c4552; --river: #3a95a7; --sun: #fff0a8; --cloud: rgba(255,255,255,.9); --window: #ffd46b;
    --av-l: 87%; --av-tl: 28%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: inline; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  [data-theme="petrin"] {
    --bg: #f5f9f0; --bg-2: #fbeef3; --card: #fff; --text: #22321f; --muted: #5f6f58; --line: #dce8d3; --line-strong: #7e9675; --input: #fff;
    --accent: #317548; --accent-strong: #317548; --accent-2: #df6f9b; --accent-text: #fff; --accent-soft: #e2f2e5;
    --ok: #2d7947; --ok-bg: #e1f3e5; --warn: #926000; --warn-bg: #fff0d0; --bad: #b5362c; --bad-bg: #fce4e3; --info: #a44873; --info-bg: #fbe3ee;
    --sky-1: #c7ecd8; --sky-2: #f9dce8; --sky-3: #fff8ee; --hero-text: #213a26; --hero-shadow: 0 1px 1px rgba(255,255,255,.95), 0 0 8px rgba(255,248,240,.95), 0 0 18px rgba(249,220,232,.8);
    --far: #a7c8a3; --near: #2e4a35; --river: #79b5a3; --sun: #ffe08f; --cloud: rgba(255,255,255,.85); --window: #ffd46b;
    --av-l: 88%; --av-tl: 28%;
    --show-sun: inline; --show-stars: none; --show-clouds: inline; --show-birds: none; --show-windows: none; --show-petals: inline;
    color-scheme: light;
  }
  [data-theme="classic"] {
    --bg: #f3f5f8; --bg-2: #eceff4; --card: #fff; --text: #1b2430; --muted: #5b6879; --line: #d9dee6; --line-strong: #8793a3; --input: #fff;
    --accent: #1f4e79; --accent-strong: #1f4e79; --accent-2: #3d7cc9; --accent-text: #fff; --accent-soft: #e1eaf4;
    --ok: #1d7a46; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff2d6; --bad: #b42318; --bad-bg: #fde8e6; --info: #1f4e79; --info-bg: #e1eaf4;
    --sky-1: #1f4e79; --sky-2: #2d6399; --sky-3: #3d78b0; --hero-text: #fff; --hero-shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 10px rgba(8,26,50,.7), 0 0 20px rgba(8,26,50,.45);
    --far: #34699c; --near: #163a5c; --river: #2a5f90; --sun: #ffffff; --cloud: rgba(255,255,255,.18); --window: #ffd46b;
    --av-l: 88%; --av-tl: 30%;
    --show-sun: none; --show-stars: none; --show-clouds: inline; --show-birds: none; --show-windows: none; --show-petals: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="classic"] {
      --bg: #12161c; --bg-2: #161b23; --card: #1b2129; --text: #e6eaf0; --muted: #9aa6b5; --line: #2e3743; --line-strong: #6e7b88; --input: #232b35;
      --accent: #5b9bd5; --accent-strong: #5b9bd5; --accent-2: #8ab8e6; --accent-text: #0d1117; --accent-soft: #1d2c3d;
      --ok: #5cc48a; --ok-bg: #173324; --warn: #f0b94a; --warn-bg: #3a2c0c; --bad: #ff7b6e; --bad-bg: #3d1714; --info: #8ab8e6; --info-bg: #1d2c3d;
      --sky-1: #0f2238; --sky-2: #163152; --sky-3: #1d3f66; --far: #1f4168; --near: #0a1828; --river: #15304f;
      --av-l: 30%; --av-tl: 88%;
      color-scheme: dark;
    }
  }

  /* ---------------------------------------------------------------- base */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The root background shows behind the iOS status bar and when pulling the page down,
     so it matches the top of the header. The body paints the page colour itself. */
  html { -webkit-text-size-adjust: 100%; background: var(--sky-1); transition: background-color .4s;
    scroll-padding: calc(16px + env(safe-area-inset-top)) 0 calc(130px + env(safe-area-inset-bottom)); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%) fixed;
    font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color .4s, color .4s;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
  /* Solid strip behind the status bar, so scrolled content never shows under the clock. */
  body::before { content: ""; position: fixed; z-index: 15; left: 0; right: 0; top: 0; height: env(safe-area-inset-top); background: var(--sky-1); pointer-events: none; }
  /* Content fades out behind the floating tab bar instead of showing through around it. */
  body::after { content: ""; position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; height: calc(96px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg-2) 55%); pointer-events: none; }
  h1, h2, h3 { letter-spacing: -.01em; }
  h2 { font-size: 1.12rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  a { color: var(--accent-strong); font-weight: 600; }
  :focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
  svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .hint { margin: 6px 0 0; }

  /* ---------------------------------------------------------------- hero */
  .hero {
    position: relative; overflow: hidden; height: calc(200px + env(safe-area-inset-top));
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 62%, var(--sky-3) 100%);
    transition: background .5s, height .3s ease;
  }
  .hero.paused * { animation-play-state: paused !important; }
  .scene { position: absolute; inset: auto 0 0 0; width: 100%; height: 66%; display: block; stroke: none; overflow: visible; }
  .scene .far { fill: var(--far); transition: fill .5s; }
  .scene .near { fill: var(--near); transition: fill .5s; }
  .scene .river { fill: var(--river); transition: fill .5s; }
  .scene .shimmer rect { fill: rgba(255,255,255,.55); animation: shimmer 5s ease-in-out infinite; }
  .scene .shimmer rect:nth-child(2) { animation-delay: -1.5s; } .scene .shimmer rect:nth-child(3) { animation-delay: -3s; } .scene .shimmer rect:nth-child(4) { animation-delay: -4s; }
  .scene .deco-sun { display: var(--show-sun); }
  .scene .sun { fill: var(--sun); }
  .scene .sun-glow { fill: var(--sun); opacity: .25; transform-box: fill-box; transform-origin: center; animation: glow 6s ease-in-out infinite; }
  .scene .deco-stars { display: var(--show-stars); fill: #fff; }
  .scene .deco-stars circle { animation: twinkle 3.2s ease-in-out infinite; }
  .scene .deco-clouds { display: var(--show-clouds); fill: var(--cloud); }
  .scene .cloud { animation: drift 46s linear infinite; }
  .scene .cloud.c2 { animation-duration: 64s; animation-delay: -30s; }
  .scene .deco-birds { display: var(--show-birds); stroke: var(--near); stroke-width: .8; fill: none; animation: fly 30s linear infinite; }
  .scene .deco-windows { display: var(--show-windows); fill: var(--window); }
  .scene .deco-windows rect { animation: twinkle 7s ease-in-out infinite; }
  .scene .deco-windows rect:nth-child(3n) { animation-delay: -2s; } .scene .deco-windows rect:nth-child(4n) { animation-delay: -4.5s; }
  .scene .deco-petals { display: var(--show-petals); fill: var(--accent-2); opacity: .8; }
  .scene .deco-petals ellipse { animation: petal 10s linear infinite; transform-box: fill-box; }
  /* Wider than a phone: the header becomes a banner as wide as the content column,
     and the skyline keeps its proportions instead of being cropped into giant blocks. */
  @media (min-width: 700px) {
    body { display: flow-root; } /* keeps the banner's top margin from exposing the root background above it */
    .hero { max-width: 608px; height: 250px; margin: 16px auto 0; border-radius: 28px; box-shadow: 0 18px 40px -22px rgba(0,0,0,.35); }
    .hero > .scene { height: 182px; }
  }
  @media (max-width: 699px) {
    .hero.compact { height: calc(132px + env(safe-area-inset-top)); }
    .hero.compact > .scene { height: 56%; }
    .hero.compact .hero-text { top: calc(14px + env(safe-area-inset-top)); }
    .hero.compact .hero-text h1 { font-size: 1.3rem; }
    .hero.compact .hero-text p { font-size: .84rem; margin-top: 3px; }
  }
  .hero-text { text-shadow: var(--hero-shadow); position: absolute; left: 0; right: 0; top: calc(18px + env(safe-area-inset-top)); padding: 0 20px; max-width: 640px; margin: 0 auto; color: var(--hero-text); }
  .hero-text h1 { margin: 0; font-size: 1.75rem; font-weight: 800; line-height: 1.15; padding-right: 116px; outline: none; }
  .hero-text p { margin: 6px 0 0; font-weight: 700; font-size: .92rem; }
  .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 1; }
  .hero-tools { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top)); right: 14px; display: flex; gap: 8px; }
  .hero-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 0;
    background: color-mix(in srgb, var(--card) 85%, transparent); color: var(--text); font: inherit; font-size: .85rem; font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); cursor: pointer;
  }

  /* ---------------------------------------------------------------- cards and controls */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin: 0 0 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.12); transition: background-color .4s, border-color .4s;
  }
  .num, .rnum {
    display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: .85rem; font-weight: 800;
    background: var(--accent-soft); color: var(--accent-strong); flex-shrink: 0;
  }
  label, .label { display: block; font-size: .82rem; font-weight: 650; color: var(--muted); margin: 12px 0 0; }
  input, select {
    display: block; width: 100%; margin-top: 5px; padding: 11px 13px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--input); border: 1.5px solid var(--line-strong); border-radius: 13px; min-width: 0;
    transition: border-color .2s, box-shadow .2s, background-color .4s;
  }
  /* iOS Safari sizes native date inputs to their content and centers the value; make them behave like text fields. */
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 47px; max-width: 100%; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input:focus, select:focus, .select-btn:focus-visible { outline: none; border-color: var(--accent-strong); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  [aria-invalid="true"] { border-color: var(--bad) !important; }
  .select-btn { display: block; width: 100%; margin: 5px 0 0; min-height: 47px; padding: 11px 13px; text-align: left; font-weight: 500;
    background: var(--input); border: 1.5px solid var(--line-strong); border-radius: 13px; color: var(--text); }
  .two, .three { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr; }
  .three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } }

  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 650;
    padding: 11px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer; margin: 10px 0 0; transition: transform .12s, box-shadow .2s, background-color .2s, opacity .2s;
  }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary {
    background: var(--accent); color: var(--accent-text); border-color: transparent;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .primary:not(:disabled):hover { box-shadow: 0 10px 26px -8px color-mix(in srgb, var(--accent) 85%, transparent); }
  .success { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .wide { width: 100%; }
  .ghost { border-style: dashed; background: transparent; }
  .chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: .88rem; margin: 0; background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
  .link { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--accent-strong); text-decoration: underline; margin: 0; font-weight: 650; }
  .danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: transparent; width: 100%; margin-top: 8px; }
  .danger-link { color: var(--bad); font-size: .88rem; margin-top: 6px; }
  .back { border: 0; background: var(--card); min-height: 44px; padding: 8px 16px 8px 10px; border-radius: 999px; margin: 0 0 12px; box-shadow: 0 4px 14px -6px rgba(0,0,0,.2); }
  .row-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .row-buttons.end { justify-content: flex-end; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-weight: 750; }
  .pill svg { width: 1em; height: 1em; stroke-width: 3; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.info, .pill.calm { background: var(--info-bg); color: var(--info); }
  .pill.muted { background: var(--bg-2); color: var(--muted); }

  .avatar {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: .78rem; font-weight: 800;
    background: hsl(var(--h) 65% var(--av-l)); color: hsl(var(--h) 45% var(--av-tl)); border: 2px solid var(--card); flex-shrink: 0;
  }
  .avatars { display: inline-flex; }
  .avatars .avatar { width: 28px; height: 28px; font-size: .68rem; margin-right: -8px; }
  .avatars:empty { display: none; }

  /* ---------------------------------------------------------------- stays list */
  .section-title { margin: 22px 4px 10px; }
  .count { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 1px 9px; font-size: .8rem; }
  .stack { display: grid; gap: 10px; }
  .stay-card {
    display: grid; gap: 6px; width: 100%; text-align: left; justify-content: stretch; justify-items: stretch; margin: 0; padding: 14px 16px 14px 20px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -14px rgba(0,0,0,.18);
  }
  .stay-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--info); }
  .stay-card.s-bad::before { background: var(--bad); } .stay-card.s-warn::before { background: var(--warn); }
  .stay-card.s-ok::before { background: var(--ok); } .stay-card.s-muted::before { background: var(--line); }
  .stay-card:hover { transform: translateY(-1px); }
  .stay-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stay-place { display: inline-flex; align-items: center; font-weight: 800; font-size: 1.02rem; }
  .apt-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) 62% 46%); margin-right: 8px; flex-shrink: 0; }
  .stay-dates { font-weight: 600; }
  .arrow { color: var(--accent-strong); }
  .stay-bottom { display: flex; align-items: center; gap: 14px; }
  .chev { margin-left: auto; display: inline-flex; color: var(--muted); transition: transform .2s; }
  .stay-card:hover .chev { transform: translateX(3px); }
  .all-done { text-align: center; font-weight: 650; color: var(--muted); padding: 10px; }
  .history { margin-top: 18px; }
  .history summary { font-weight: 700; color: var(--muted); padding: 8px 4px; cursor: pointer; }
  .history .stay-card { opacity: .82; }
  .empty { text-align: center; padding: 8px 8px 20px; }
  .empty-art { height: 90px; position: relative; border-radius: 18px; overflow: hidden; margin: 18px auto 6px; max-width: 280px;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 60%, var(--sky-3)); }
  .empty h3 { margin: 12px 0 4px; }

  .onboarding h2 { font-size: 1.3rem; }
  .onboarding p { margin: 0 0 6px; }
  .checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .checklist button { width: 100%; justify-content: flex-start; text-align: left; margin: 0; background: var(--bg); border-color: transparent; }
  .checklist .tick { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: .85rem; font-weight: 800; }
  .checklist .done button { color: var(--muted); text-decoration: line-through; }
  .checklist .done .tick { background: var(--ok); color: #fff; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  .checklist .done .tick svg { stroke-width: 3; width: 14px; height: 14px; }

  /* ---------------------------------------------------------------- stay detail */
  .stepper { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 14px; padding: 12px 8px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--line); }
  .stepper li { position: relative; color: var(--muted); }
  .stepper button { display: grid; justify-items: center; gap: 4px; width: 100%; min-height: 48px; margin: 0; padding: 0 2px; border: 0; background: transparent;
    font-size: .74rem; font-weight: 700; color: inherit; border-radius: 12px; position: relative; z-index: 1; }
  .stepper li:not(:last-child)::after { content: ""; position: absolute; top: 13px; left: calc(50% + 17px); right: calc(-50% + 17px); height: 3px; border-radius: 2px; background: var(--line); }
  .stepper li.done:not(:last-child)::after { background: var(--ok); }
  .stepper .dot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-2); color: var(--muted); font-size: .8rem; font-weight: 800; transition: background-color .3s, transform .3s; }
  .stepper .done .dot { background: var(--ok); color: #fff; }
  .stepper .done .dot svg { width: 15px; height: 15px; stroke-width: 3; }
  .stepper .current { color: var(--accent-strong); }
  .stepper .current .dot { background: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation: ring 2s ease-out 2; }

  .deadline { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; }
  .ask { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
  .ask > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .nights { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .nights span { margin-right: 4px; }
  .nights .chip { min-width: 44px; }
  .field .chips { margin-top: 6px; }

  .add-guests { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 0; }
  .add-btn { flex-direction: column; gap: 6px; min-height: 96px; margin: 0; padding: 14px 10px; border-radius: 18px; border: 1.5px dashed var(--line-strong); background: transparent; text-align: center; }
  .add-btn svg { width: 28px; height: 28px; }
  .add-btn.main { background: var(--accent-soft); color: var(--accent-strong); border: 1.5px solid transparent; }
  .privacy { display: flex; gap: 8px; align-items: flex-start; margin: 10px 2px 0; }
  .privacy svg { width: 15px; height: 15px; margin-top: 2px; }
  .scan-doc svg { width: 72px; height: 50px; stroke: none; }
  .pp-body { fill: var(--accent); } .pp-photo { fill: color-mix(in srgb, var(--accent-text) 75%, transparent); }
  .pp-line { fill: color-mix(in srgb, var(--accent-text) 55%, transparent); } .pp-mrz { fill: color-mix(in srgb, var(--accent-text) 85%, transparent); }
  .tray { margin: 14px 0 0; padding: 12px; border-radius: 18px; background: var(--bg); }
  .tray p { margin: 0 0 10px; }
  .tray-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .tray-item { position: relative; margin: 0; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--bg-2); animation: rise .3s both; }
  .tray-item img, .thumb img { width: 100%; height: 100%; object-fit: contain; transform: rotate(var(--rot)); transition: transform .25s; }
  .tray-tools { position: absolute; left: 4px; right: 4px; bottom: 4px; display: flex; justify-content: space-between; }
  .tray-tools button { width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--card) 92%, transparent); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .tray-add { aspect-ratio: 1; margin: 0; border-style: dashed; border-color: var(--line-strong); background: transparent; color: var(--accent-strong); }
  .scanner { display: grid; justify-items: center; gap: 6px; padding: 20px 14px; margin: 14px 0 0; border-radius: 20px; background: var(--accent-soft); text-align: center; }
  .scan-doc { position: relative; width: 96px; height: 66px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; }
  .scan-doc svg { width: 96px; height: 66px; }
  .beam { position: absolute; left: 0; right: 0; height: 18px; top: -18px;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent-2) 60%, transparent), transparent); animation: scan 1.6s ease-in-out infinite; }
  .scan-text { font-weight: 800; color: var(--accent-strong); min-height: 1.4em; font-variant-numeric: tabular-nums; }
  .scanner button { margin-top: 4px; }

  .guest-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 0; }
  .guest-summary:empty { display: none; }
  .guest-list { margin-top: 6px; }
  .guest { border-top: 1px solid var(--line); margin-top: 8px; }
  .guest-row { display: block; width: 100%; margin: 0; padding: 12px 2px; min-height: 64px; border: 0; background: transparent; text-align: left; border-radius: 14px; }
  .guest-row:active:not(:disabled) { transform: none; background: var(--bg); }
  .guest-row .chev svg { transition: transform .2s; }
  .guest.open .guest-row .chev svg { transform: rotate(90deg); }
  .guest-body { padding: 0 0 12px; }
  .guest.open .guest-body { animation: rise .3s both; }
  .guest-head { display: flex; align-items: center; gap: 10px; }
  .guest-name { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .guest-name strong, .guest-name .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guest-name .pills { justify-content: flex-start; margin-top: 3px; }
  .guest .avatar { width: 40px; height: 40px; font-size: .85rem; }
  .field { min-width: 0; }
  .field-msg { display: grid; gap: 4px; }
  .field-msg:empty { display: none; }
  .msg { display: block; margin-top: 6px; padding: 7px 10px; border-radius: 10px; font-size: .84rem; font-weight: 600; }
  .msg.error { background: var(--bad-bg); color: var(--bad); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .hint-box { margin: 4px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); color: var(--muted); font-size: .9rem; }
  .guest-photos { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; }
  .thumb { width: 76px; height: 76px; flex-shrink: 0; margin: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--bg-2); border: 1.5px solid var(--line); }
  ul.warnings { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .86rem; }
  ul.warnings li { padding: 8px 12px; border-radius: 12px; }
  ul.warnings li { background: var(--warn-bg); color: var(--warn); }
  .all-good { display: flex; align-items: center; gap: 10px; font-weight: 750; color: var(--ok); background: var(--ok-bg); padding: 10px 14px; border-radius: 14px; margin: 0; }
  .draw-check { width: 26px; height: 26px; stroke-width: 2.4; }
  .draw-check circle { stroke-dasharray: 64; stroke-dashoffset: 64; animation: draw .6s ease forwards; }
  .draw-check path { stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw .35s .45s ease forwards; }
  .rsteps { display: grid; gap: 14px; margin-top: 16px; }
  .rstep { display: flex; gap: 12px; align-items: flex-start; }
  .rstep > div { flex: 1; padding-top: 2px; }
  .rstep button { margin-top: 8px; }
  .rstep a { display: inline-block; padding: 12px 2px; margin: -12px 0; }
  details { margin-top: 14px; }
  summary { cursor: pointer; padding: 11px 0; min-height: 44px; font-weight: 650; }
  .property { border-top: 1px solid var(--line); padding: 8px 0 12px; }
  .copy-table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: .9rem; }
  .copy-table caption { text-align: left; font-weight: 800; padding: 6px 0; display: flex; align-items: center; gap: 8px; }
  .copy-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px 6px 0; width: 40%; }
  .copy-table td { padding: 6px 0; word-break: break-word; }
  .copy-table td:last-child { text-align: right; width: 1%; padding-left: 8px; }

  /* ---------------------------------------------------------------- settings */
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .theme-card { display: grid; gap: 2px; text-align: left; padding: 8px 8px 10px; margin: 0; border-radius: 18px; background: var(--bg); border: 2px solid transparent; }
  .theme-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .theme-preview { display: block; position: relative; height: 72px; border-radius: 12px; overflow: hidden; margin-bottom: 6px;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 62%, var(--sky-3)); }
  .theme-preview .scene, .empty-art .scene { height: 100%; }
  .theme-name { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--text); }
  .theme-check { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-text); opacity: 0; transform: scale(.3); transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
  .theme-check svg { width: 12px; height: 12px; stroke-width: 3.5; }
  .theme-card.selected .theme-check { opacity: 1; transform: scale(1); }
  .theme-tag { font-size: .76rem; color: var(--muted); font-weight: 500; }
  .theme-card.selected .theme-tag { color: var(--text); }
  /* Previews stay still; only the real header moves. */
  .theme-preview *, .empty-art * { animation: none !important; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-top: 6px; border-radius: 14px; background: var(--bg); }
  .segmented button { margin: 0; border: 0; min-height: 44px; padding: 9px 6px; background: transparent; border-radius: 11px; }
  .segmented button.on { background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.1); color: var(--accent-strong); }

  .help-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .help-steps li { display: flex; gap: 12px; align-items: flex-start; }
  .help-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--accent-soft); font-size: 1.2rem; flex-shrink: 0; }
  .prose ul { padding-left: 20px; margin: 0; } .prose li { margin: 6px 0; }

  /* ---------------------------------------------------------------- workflow states */
  .pills { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  .banner { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-weight: 650; font-size: .9rem; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .still { margin: 12px 0 0; font-weight: 750; font-size: .88rem; }
  .still + ul { margin-top: 6px; }
  ul.todo { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
  .todo-item { width: 100%; min-height: 44px; margin: 0; justify-content: space-between; text-align: left; background: var(--bg); border-color: transparent; font-weight: 600; font-size: .9rem; }
  .todo-item svg { width: 16px; height: 16px; color: var(--muted); }
  .todo.attempted .todo-item { background: var(--bad-bg); color: var(--bad); }
  .todo.attempted .todo-item svg { color: var(--bad); }
  .review { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; }
  .review button { margin: 0; }
  .reviewed { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; color: var(--ok); font-weight: 700; font-size: .9rem; }
  .reviewed svg { stroke-width: 3; width: 16px; height: 16px; }
  .save-status { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem !important; opacity: .8; }
  .save-status svg { width: 13px; height: 13px; stroke-width: 3; }
  .reminder h2 svg { color: var(--accent-strong); }
  .reminder p { margin: 0; }
  .backup-status { margin: 10px 0 0; }

  /* ---------------------------------------------------------------- sheets (in-app dialogs) */
  #sheet-layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(10,12,20,.45); pointer-events: auto; animation: fade .2s ease both; }
  .sheet {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100%); max-height: 88vh; overflow: auto; pointer-events: auto;
    background: var(--card); color: var(--text); border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: slideup .3s cubic-bezier(.2,.9,.3,1) both;
  }
  @media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translate(-50%, -50%); border-radius: 24px; padding-bottom: 20px; } }
  .sheet h2 { font-size: 1.2rem; }
  .sheet p { margin: 8px 0; }
  .sheet-warn { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; }
  .sheet-warn .chip { margin-top: 8px; }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .sheet-actions button { margin: 0; }
  fieldset.choice { border: 0; padding: 0; margin: 0; }
  fieldset.choice legend { font-size: .82rem; font-weight: 650; color: var(--muted); margin-bottom: 4px; }
  label.radio, label.check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 4px 0; color: var(--text); font-size: 1rem; font-weight: 600; }
  label.radio input, label.check input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--accent); }
  .option-list { display: grid; gap: 4px; margin-top: 8px; }
  .option-list.scroll { max-height: 56vh; overflow: auto; margin-top: 10px; }
  .option { justify-content: space-between; min-height: 48px; margin: 0; text-align: left; background: var(--bg); border-color: transparent; font-weight: 600; }
  .option.on { background: var(--accent-soft); color: var(--accent-strong); }
  .option-head { margin: 12px 4px 4px; font-size: .76rem; font-weight: 750; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .viewer { display: grid; place-items: center; max-height: 70vh; overflow: auto; border-radius: 14px; background: #000; }
  .viewer img { max-width: 100%; max-height: 70vh; transform: rotate(var(--rot)); cursor: zoom-in; }
  .viewer.zoomed { place-items: start; }
  .viewer.zoomed img { max-width: none; max-height: none; width: 220%; cursor: zoom-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slideup { from { transform: translate(-50%, 40px); opacity: 0; } }

  /* ---------------------------------------------------------------- tab bar, toast, confetti */
  .tabbar {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom));
    width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 26px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 34px -10px rgba(0,0,0,.3);
  }
  .tab { display: grid; justify-items: center; gap: 2px; min-height: 52px; margin: 0; padding: 6px; border: 0; background: transparent; color: var(--muted); font-size: .72rem; border-radius: 16px; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent-strong); background: var(--accent-soft); }
  .fab-wrap { display: grid; justify-items: center; gap: 2px; margin: -30px 0 0; padding: 0; border: 0; background: transparent; }
  .fab-wrap:active:not(:disabled) { transform: none; }
  .fab { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--bg); color: var(--accent-text);
    background: var(--accent); box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--accent) 80%, transparent); transition: transform .12s; }
  .fab-wrap:active .fab { transform: scale(.94); }
  .fab svg { width: 28px; height: 28px; stroke-width: 2.6; transition: transform .3s; }
  .fab-wrap:active .fab svg { transform: rotate(90deg); }
  .fab-label { font-size: .72rem; font-weight: 700; color: var(--accent-strong); }

  #toast-layer { position: fixed; z-index: 20; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top)); display: grid; justify-items: center; pointer-events: none; padding: 0 16px; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 520px; padding: 12px 16px; border-radius: 18px; font-weight: 650;
    background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: 0 14px 34px -10px rgba(0,0,0,.35); animation: drop .45s cubic-bezier(.2,1.4,.4,1) both; }
  .toast-text { cursor: pointer; }
  .toast-action { margin: 0 0 0 4px; padding: 8px 14px; min-height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; white-space: nowrap; }
  .toast.leaving { animation: lift .35s ease both; }
  .toast-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; font-weight: 900; }
  .toast.ok .toast-icon { background: var(--ok); color: #fff; } .toast.ok .toast-icon svg { width: 15px; height: 15px; stroke-width: 3; }
  .toast.error .toast-icon { background: var(--bad); color: #fff; }
  .toast.error { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .confetti i { position: absolute; bottom: 22%; width: 9px; height: 13px; border-radius: 2px; animation: burst 1.9s cubic-bezier(.15,.7,.35,1) forwards; }

  /* ---------------------------------------------------------------- motion */
  .enter > * { animation: rise .5s cubic-bezier(.2,.8,.3,1) both; }
  .enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; }
  .enter > *:nth-child(5) { animation-delay: .2s; } .enter > *:nth-child(n+6) { animation-delay: .25s; }
  .enter .stack > * { animation: rise .5s cubic-bezier(.2,.8,.3,1) both; }
  .enter .stack > *:nth-child(2) { animation-delay: .12s; } .enter .stack > *:nth-child(3) { animation-delay: .18s; } .enter .stack > *:nth-child(n+4) { animation-delay: .24s; }
  .pop-in { animation: rise .55s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i, 0) * .12s); }
  .help-steps li { animation: rise .5s both; animation-delay: calc(var(--i) * .07s + .1s); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-24px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes lift { to { opacity: 0; transform: translateY(-16px); } }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(460px); } }
  @keyframes fly { from { transform: translate(-30px, 46px); } to { transform: translate(430px, 22px); } }
  @keyframes glow { 50% { transform: scale(1.25); opacity: .12; } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes shimmer { 50% { transform: translateX(14px); opacity: .2; } }
  @keyframes petal { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translate(-60px, 130px) rotate(540deg); opacity: 0; } }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 15%, 45% { transform: rotate(16deg); } 30%, 60% { transform: rotate(-8deg); } 75% { transform: rotate(0); } }
  @keyframes scan { 0% { top: -18px; } 100% { top: 66px; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes burst {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    45% { transform: translate(calc(var(--dx) * .7), var(--dy)) rotate(calc(var(--r) * .5)); opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) * -.3 + 260px)) rotate(var(--r)); opacity: 0; }
  }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
